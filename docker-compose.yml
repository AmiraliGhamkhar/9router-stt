services:
  9router-stt:
    build: .
    image: 9router-stt:local
    container_name: 9router-stt
    restart: unless-stopped
    ports:
      - "20128:20128"
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
    volumes:
      - 9router-stt-data:/app/data

volumes:
  9router-stt-data:
